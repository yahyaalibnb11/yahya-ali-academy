<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin · Yahya Ali Academy</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@600;700&display=swap">
<link rel="stylesheet" href="assets/brand.css">
<style>
  body { padding-bottom: 60px; }
  .top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; display: flex; align-items: center; gap: 16px; height: 64px; padding-left: var(--gut); padding-right: var(--gut-r); border-bottom: 1px solid var(--line); background: rgba(6,8,14,.85); backdrop-filter: blur(12px); }
  .top .r { margin-left: auto; display: flex; gap: 8px; }
  main { max-width: 1180px; margin: 0 auto; padding: 24px var(--gut-r) 0 var(--gut); display: grid; gap: 22px; }
  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .kpi { padding: 18px; border-radius: 14px; border: 1px solid var(--line); background: var(--night); display: grid; gap: 6px; }
  .kpi span { font: 600 11px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--mute); }
  .kpi b { font: 600 28px var(--f-mono); }
  .kpi.hot { border-color: rgba(255,181,71,.4); background: rgba(255,181,71,.05); }
  .tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--line); overflow-x: auto; }
  .tabs button { padding: 12px 16px; background: none; border: 0; border-bottom: 2px solid transparent; color: var(--mute); font: 700 14px var(--f-body); cursor: pointer; white-space: nowrap; }
  .tabs button[aria-selected="true"] { color: var(--fg); border-color: var(--ember); }
  .card { border-radius: 16px; border: 1px solid var(--line); background: var(--night); overflow: hidden; }
  .row { display: grid; grid-template-columns: 90px minmax(0, 1.3fr) minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 14px 18px; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .row img { width: 90px; height: 90px; object-fit: cover; border-radius: 10px; border: 1px solid var(--line-2); cursor: zoom-in; background: #000; }
  .row b { display: block; } .row small { color: var(--mute); display: block; word-break: break-all; }
  .acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .btn-ok { background: rgba(79,209,139,.12); color: var(--ok); border-color: rgba(79,209,139,.4); }
  .btn-no { background: rgba(255,93,108,.08); color: var(--bad); border-color: rgba(255,93,108,.35); }
  .empty { padding: 34px; text-align: center; color: var(--mute); }
  .srow { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) minmax(0, .8fr) auto; gap: 14px; align-items: center; padding: 12px 18px; border-top: 1px solid var(--line); font-size: 14px; }
  .search { max-width: 360px; }
  .gate { min-height: 80vh; display: grid; place-items: center; padding: 0 var(--gut-r) 0 var(--gut); }
  .gate form { width: 100%; max-width: 380px; display: grid; gap: 14px; }
  .zoom { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.9); display: grid; place-items: center; padding: 20px; cursor: zoom-out; }
  .zoom img { max-height: 92vh; border-radius: 12px; }
  @media (max-width: 760px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .row, .srow { grid-template-columns: minmax(0, 1fr); } .row img { width: 100%; height: 180px; } .acts { justify-content: flex-start; } }
</style>
</head>
<body>
<header class="top">
  <a class="logo" href="index.html"><span class="logo-mark">YA</span><span>Admin<small>Academy</small></span></a>
  <div class="r"><a class="btn btn-ghost btn-sm" href="portal.html">Portal</a><button class="btn btn-ghost btn-sm" id="logout" type="button" hidden>Logout</button></div>
</header>

<section class="gate" id="gate" hidden>
  <form id="fLogin">
    <h1 style="font-size:26px">Admin login</h1>
    <div class="field"><label for="em">Email</label><input class="input" id="em" type="email" required autocomplete="email"></div>
    <div class="field"><label for="pw">Password</label><input class="input" id="pw" type="password" required autocomplete="current-password"></div>
    <button class="btn btn-primary" type="submit">Login</button>
    <p id="gMsg" class="muted" style="color:var(--mute)"></p>
  </form>
</section>

<main id="main" hidden>
  <div class="kpis">
    <div class="kpi hot"><span>Pending payments</span><b id="kPend">0</b></div>
    <div class="kpi"><span>Enrolled students</span><b id="kEnr">0</b></div>
    <div class="kpi"><span>Free accounts</span><b id="kFree">0</b></div>
    <div class="kpi"><span>Revenue (approved)</span><b id="kRev">Rs 0</b></div>
  </div>
  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-t="pay">Payments</button>
    <button role="tab" aria-selected="false" data-t="stu">Students</button>
  </div>
  <section id="tPay"><div class="card" id="payList"></div></section>
  <section id="tStu" hidden>
    <input class="input search" id="q" placeholder="Naam, email ya number se dhoondein" style="margin-bottom:12px">
    <div class="card" id="stuList"></div>
  </section>
</main>

<script src="assets/config.js"></script>
<script src="assets/vendor/supabase.js"></script>
<script src="assets/app.js"></script>
<script>
(() => {
  const $ = (s) => document.querySelector(s);
  let students = [];
  $("#fLogin").onsubmit = async (e) => {
    e.preventDefault();
    const { error } = await sb.auth.signInWithPassword({ email: $("#em").value.trim(), password: $("#pw").value });
    if (error) return ($("#gMsg").textContent = "Email ya password ghalat hai.");
    boot();
  };
  $("#logout").onclick = async () => { await sb.auth.signOut(); location.reload(); };
  document.querySelectorAll(".tabs button").forEach((b) => (b.onclick = () => {
    document.querySelectorAll(".tabs button").forEach((x) => x.setAttribute("aria-selected", x === b));
    $("#tPay").hidden = b.dataset.t !== "pay"; $("#tStu").hidden = b.dataset.t !== "stu";
  }));

  async function boot() {
    const { data: { user } } = await sb.auth.getUser();
    if (!user) { $("#gate").hidden = false; return; }
    const { data: isAdmin } = await sb.rpc("acad_is_admin");
    if (!isAdmin) { $("#gate").hidden = false; $("#gMsg").textContent = "Ye account admin nahi hai."; return; }
    $("#gate").hidden = true; $("#main").hidden = false; $("#logout").hidden = false;
    await load();
    sb.channel("acad-pay").on("postgres_changes", { event: "INSERT", schema: "public", table: "acad_payments" }, () => { toast("Nayi payment aayi"); load(); }).subscribe();
    setInterval(load, 60000);
  }

  async function load() {
    const [{ data: pays }, { data: stu }] = await Promise.all([
      sb.from("acad_payments").select("*").order("created_at", { ascending: false }).limit(300),
      sb.rpc("acad_admin_students"),
    ]);
    students = stu || [];
    const byId = Object.fromEntries(students.map((s) => [s.id, s]));
    const pend = (pays || []).filter((p) => p.status === "pending");
    $("#kPend").textContent = pend.length;
    $("#kEnr").textContent = students.filter((s) => s.status === "active").length;
    $("#kFree").textContent = students.filter((s) => s.status !== "active").length;
    $("#kRev").textContent = rs((pays || []).filter((p) => p.status === "approved").reduce((a, p) => a + p.amount, 0));
    const list = [...pend, ...(pays || []).filter((p) => p.status !== "pending").slice(0, 40)];
    const urls = {};
    const paths = list.map((p) => p.proof_path).filter(Boolean);
    if (paths.length) { const { data } = await sb.storage.from("acad-proofs").createSignedUrls(paths, 3600); (data || []).forEach((d, i) => (urls[paths[i]] = d.signedUrl)); }
    $("#payList").innerHTML = list.length ? list.map((p) => {
      const s = byId[p.user_id] || {};
      return `<div class="row"><img src="${esc(urls[p.proof_path] || "")}" alt="Payment proof" data-z>
        <div><b>${esc(s.full_name || "Student")}</b><small>${esc(s.email || "")} · ${esc(s.phone || "")}</small></div>
        <div><b class="mono">${rs(p.amount)} · ${esc(p.method)}</b><small>Ref: ${esc(p.txn_ref || "-")} · ${fmtDate(p.created_at)}</small></div>
        <div class="acts">${p.status === "pending"
          ? `<button class="btn btn-sm btn-ok" data-ok="${p.id}">Approve · unlock</button><button class="btn btn-sm btn-no" data-no="${p.id}">Reject</button>`
          : `<span class="chip ${p.status === "approved" ? "ok" : ""}">${p.status}</span>`}</div></div>`;
    }).join("") : `<div class="empty">Abhi koi payment nahi.</div>`;
    $("#payList").querySelectorAll("[data-ok]").forEach((b) => (b.onclick = async () => { b.disabled = true; const { error } = await sb.rpc("acad_approve_payment", { p_id: +b.dataset.ok }); toast(error ? "Error: " + error.message : "Approved. Student ka course unlock ho gaya."); load(); }));
    $("#payList").querySelectorAll("[data-no]").forEach((b) => (b.onclick = () => {
      const row = b.closest(".acts");
      row.innerHTML = `<input class="input" placeholder="Wajah (student ko dikhegi)" style="min-height:38px;max-width:220px"><button class="btn btn-sm btn-no" type="button">Reject karein</button>`;
      row.querySelector("button").onclick = async () => { await sb.rpc("acad_reject_payment", { p_id: +b.dataset.no, p_note: row.querySelector("input").value }); load(); };
    }));
    $("#payList").querySelectorAll("[data-z]").forEach((i) => (i.onclick = () => { const z = document.createElement("div"); z.className = "zoom"; z.innerHTML = `<img src="${i.src}" alt="">`; z.onclick = () => z.remove(); document.body.append(z); }));
    renderStudents();
  }
  function renderStudents() {
    const q = $("#q").value.toLowerCase();
    const rows = students.filter((s) => !q || [s.full_name, s.email, s.phone].join(" ").toLowerCase().includes(q));
    $("#stuList").innerHTML = rows.length ? rows.map((s) => `<div class="srow">
      <div><b>${esc(s.full_name || "-")}</b><small style="color:var(--mute);display:block">${esc(s.email)} · ${esc(s.phone || "")}</small></div>
      <div><span class="chip ${s.status === "active" ? "ok" : ""}">${s.status === "active" ? "Enrolled" : s.status === "revoked" ? "Revoked" : "Free"}</span></div>
      <div><small style="color:var(--mute)">${esc(s.device || "no device")}${s.last_seen ? " · " + fmtDate(s.last_seen) : ""}</small></div>
      <div class="acts">${s.status === "active" ? `<button class="btn btn-sm btn-no" data-rev="${s.id}">Access band</button>` : `<button class="btn btn-sm btn-ok" data-grant="${s.id}">Access dein</button>`}<button class="btn btn-sm btn-ghost" data-dev="${s.id}">Device reset</button></div></div>`).join("") : `<div class="empty">Koi student nahi mila.</div>`;
    $("#stuList").querySelectorAll("[data-grant],[data-rev]").forEach((b) => (b.onclick = async () => { await sb.rpc("acad_set_access", { p_user: b.dataset.grant || b.dataset.rev, p_active: !!b.dataset.grant }); toast("Update ho gaya"); load(); }));
    $("#stuList").querySelectorAll("[data-dev]").forEach((b) => (b.onclick = async () => { await sb.rpc("acad_reset_device", { p_user: b.dataset.dev }); toast("Device reset. Student agli dafa login pe naya device use kar sakta hai."); load(); }));
  }
  $("#q").oninput = renderStudents;
  boot();
})();
</script>
</body>
</html>
